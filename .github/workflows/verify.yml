name: verify

# The pack promises that every shipped script is verified and every documented claim is tested.
# tests/run.sh and tests/invariants.sh are that verification; this workflow is the part a
# contributor cannot forget to run, plus the ShellCheck gate pinned at zero (see .shellcheckrc).
#
# The suites need bash, python3, curl, git and node. They use the network only for the
# MusicBrainz section, which skips itself with a warning when musicbrainz.org is unreachable.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'   # matches local verification; the MCP server needs fetch,
                              # AbortSignal.timeout and web streams (18+), and 20 is EOL

      - name: Syntax - every shell script, plus the two Node files
        run: |
          set -euo pipefail
          mapfile -t sh < <(git ls-files '*.sh')
          [ "${#sh[@]}" -gt 0 ] || { echo 'no shell files: is this a git checkout?' >&2; exit 1; }
          for f in "${sh[@]}"; do bash -n "$f"; done
          node --check mcp/local-readonly/server.js
          node --check tests/mcp-fixture.js
          echo "syntax OK: ${#sh[@]} shell scripts, 2 node files"

      - name: ShellCheck (pinned, not the runner's apt package)
        run: |
          set -euo pipefail
          # Pinned deliberately. ubuntu-latest's apt shellcheck is 0.9.0, which still reports checks
          # that 0.11.0 dropped: it failed this job on SC2002 in tests/invariants.sh, a finding a
          # maintainer running 0.11.0 locally cannot reproduce. A gate is only worth having if it is
          # deterministic, so fetch the version this pack is verified against (see .shellcheckrc).
          # The asset is x86_64, which is what ubuntu-latest is.
          SC_VERSION=v0.11.0
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/sc.tar.xz -C /tmp
          SC="/tmp/shellcheck-${SC_VERSION}/shellcheck"
          "$SC" --version
          mapfile -t sh < <(git ls-files '*.sh')
          # No arguments would make ShellCheck read stdin and hang; fail loudly instead.
          [ "${#sh[@]}" -gt 0 ] || { echo 'no shell files: is this a git checkout?' >&2; exit 1; }
          "$SC" -x "${sh[@]}"

      - name: Behaviour suite  (tests/run.sh)
        run: bash tests/run.sh

      - name: Invariant suite  (tests/invariants.sh)
        run: bash tests/invariants.sh
